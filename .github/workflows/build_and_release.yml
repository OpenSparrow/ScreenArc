name: Android CI/CD - Build & Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual pipeline triggering from GitHub Actions UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =========================================================================
  # JOB 1: Compile, Test & Build Release APK
  # =========================================================================
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.generate_tag.outputs.tag }}
      apk_path: ${{ steps.locate_apk.outputs.path }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history required for accurate changelog generation

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # Automatically caches ~/.gradle caches & wrapper

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Compute Dynamic Release Tag
        id: generate_tag
        run: |
          # Formats: v1.0.<run_number> (e.g., v1.0.42)
          TAG_NAME="v1.0.${{ github.run_number }}"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Generated dynamic tag: $TAG_NAME"

      # -----------------------------------------------------------------------
      # OPTIONAL: Production Keystore Signing Setup
      # If you maintain production signing keys in GitHub repository secrets:
      #
      # - name: Decode Android Keystore
      #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #   run: |
      #     echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
      #   env:
      #     KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      #     KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      #     KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # -----------------------------------------------------------------------

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate & Standardize Output APK
        id: locate_apk
        run: |
          # Finds either app-release.apk or app-release-unsigned.apk
          APK_FILE=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No release APK found in build outputs!" >&2
            exit 1
          fi
          
          # Rename to identifiable filename with version tag
          TARGET_APK="app/build/outputs/apk/release/ScreenArc-${{ steps.generate_tag.outputs.tag }}.apk"
          cp "$APK_FILE" "$TARGET_APK"
          
          echo "path=$TARGET_APK" >> "$GITHUB_OUTPUT"
          echo "Artifact ready at: $TARGET_APK"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenarc-release-apk
          path: ${{ steps.locate_apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  # =========================================================================
  # JOB 2: Automated GitHub Release (Main Branch Merges / Pushes Only)
  # =========================================================================
  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create tags and publish GitHub Releases
      pull-requests: read # Required by mikepenz/release-changelog-builder-action to query PRs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: screenarc-release-apk
          path: release-artifacts

      - name: Generate Release Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        continue-on-error: true
        with:
          failOnError: false
          configurationJson: |
            {
              "categories": [
                { "title": "## 🚀 New Features", "labels": ["feature", "feat"] },
                { "title": "## 🐛 Bug Fixes", "labels": ["fix", "bug"] },
                { "title": "## 🔨 Refactors & Performance", "labels": ["refactor", "perf"] },
                { "title": "## 🧹 Maintenance & Chores", "labels": ["chore", "docs"] }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: "ScreenArc Release ${{ needs.build.outputs.release_tag }}"
          body: |
            ## ScreenArc Android Release

            **Build Details:**
            - **Tag**: `${{ needs.build.outputs.release_tag }}`
            - **Commit**: `${{ github.sha }}`
            - **Target**: Android 8.0+ (API 26+)

            ${{ steps.changelog.outputs.changelog }}

            ---
            ### 📲 Installation
            Download the attached `.apk` file below to install or update ScreenArc on your device.
          files: release-artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
